<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuran Meal Takip v0.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            max-width: 780px;
            margin: 0 auto;
            padding: 16px;
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.1em;
            color: #8fd4ff;
            font-weight: 600;
            margin-bottom: 16px;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .state-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(100, 116, 139, 0.3);
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .state-badge.BEKLEME { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }
        .state-badge.FATIHA  { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }
        .state-badge.ZAMM    { background: rgba(16, 185, 129, 0.25); color: #34d399; }
        .state-badge.ARA     { background: rgba(239, 68, 68, 0.25); color: #f87171; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            font-size: 16px;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
            transition: all 0.2s;
        }
        #startBtn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        #stopBtn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        button:disabled { background: #374151 !important; opacity: 0.4; cursor: not-allowed; }

        .verses-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .verse {
            padding: 16px 20px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 2px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .verse.old {
            opacity: 0.35;
            font-size: 0.9em;
        }
        .verse.current {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(16, 185, 129, 0.1));
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
            transform: scale(1.02);
        }

        @keyframes slideUpAndFlash {
            0% {
                transform: translateY(60px) scale(0.98);
                opacity: 0;
                border-color: rgba(239, 68, 68, 0.9);
                box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3),
                            0 8px 30px rgba(239, 68, 68, 0.25);
            }
            20% {
                transform: translateY(0) scale(1.02);
                opacity: 1;
                border-color: rgba(239, 68, 68, 1);
                box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.4),
                            0 10px 40px rgba(239, 68, 68, 0.35);
            }
            60% {
                border-color: rgba(239, 68, 68, 0.8);
                box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25),
                            0 8px 30px rgba(239, 68, 68, 0.2);
            }
            100% {
                transform: translateY(0) scale(1.02);
                opacity: 1;
                border-color: rgba(59, 130, 246, 0.4);
                box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
            }
        }
        .verse.newly-arrived.current {
            animation: slideUpAndFlash 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes gentleSlide {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0.35; }
        }
        .verse.newly-arrived.old {
            animation: gentleSlide 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .verse-name {
            font-size: 15px;
            color: #8fd4ff;
            font-weight: 600;
        }
        .verse-name-ar {
            font-family: 'Amiri Quran', serif;
            font-size: 16px;
            color: #7dd3fc;
            direction: rtl;
            margin-right: 8px;
        }
        .verse-ref {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }
        .verse.current .verse-name { font-size: 18px; }
        .verse.current .verse-name-ar { font-size: 19px; }
        .verse.current .verse-ref { font-size: 15px; color: #94a3b8; }

        .verse-meal {
            font-size: 19px;
            line-height: 1.6;
            color: #e7e9ea;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .verse.current .verse-meal {
            font-size: 26px;
            line-height: 1.5;
            font-weight: 500;
        }

        .verse-arabic {
            font-family: 'Amiri Quran', serif;
            font-size: 22px;
            line-height: 1.8;
            direction: rtl;
            text-align: right;
            color: #d1d5db;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
            opacity: 0.8;
        }
        .verse.current .verse-arabic {
            font-size: 28px;
            opacity: 1;
        }

        /* YENİ: Eşleşen kelimeler — sarı font */
        .verse-arabic .word-highlighted {
            color: #fbbf24;  /* sarı (amber-400) */
            font-weight: 600;
        }
        .verse.current .verse-arabic .word-highlighted {
            color: #fde047;  /* daha parlak sarı (yellow-300) — current için */
            font-weight: 700;
        }

        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 16px;
            font-style: italic;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            padding: 8px 4px;
            margin-top: 12px;
        }
        .statusbar .meter {
            height: 4px;
            width: 60px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            margin-left: 8px;
        }
        .statusbar .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            width: 0%;
            transition: width 0.1s;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .verse { padding: 12px 16px; }
            .verse-meal { font-size: 16px; }
            .verse.current .verse-meal { font-size: 22px; }
            .verse-arabic { font-size: 20px; }
            .verse.current .verse-arabic { font-size: 24px; }
        }
    </style>
</head>
<body>
	<div id="asr-badge" style="position:fixed; top:8px; left:8px; background:rgba(0,180,255,0.15); border:1px solid rgba(0,180,255,0.4); padding:4px 10px; border-radius:6px; font-size:11px; color:#7dd3fc; font-family:monospace; z-index:1000;">
  ASR: {{ asr_label }}
</div>
    <h1>
        <span>🕌 Kuran Meal Takip</span>
        <span id="state-badge" class="state-badge BEKLEME">BEKLEME</span>
    </h1>

    <div class="controls">
        <button id="startBtn" onclick="startRecording()">🎙 Başlat</button>
        <button id="stopBtn" onclick="stopRecording()" disabled>⏹ Durdur</button>
    </div>

    <div id="verses" class="verses-container">
        <div class="placeholder">Mikrofona Kuran okunduğunda meal burada görünecek</div>
    </div>

    <div class="statusbar">
        <div>
            <span id="position">—</span> · 
            güven <span id="confidence">—</span> · 
            chunk <span id="chunk-count">0</span>
        </div>
        <div style="display: flex; align-items: center;">
            <span id="ses-db">—</span>
            <div class="meter"><div id="meter" class="meter-fill"></div></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
