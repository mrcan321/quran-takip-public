name: Generate Namazda Anla social images
on:
  push:
    paths:
      - ".github/workflows/namazdaanla-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Render 15 original PNG cards
        env:
          TOPICS_JSON: '[["2026-10-16","Küçük bir iyilik","En küçük davranışlarımızın bile değeri var mı?","Zilzâl 99:7–8","#D4B278"],["2026-10-17","Zamanı nasıl kullanıyoruz?","Bugün doğru ve sabır için ne yaptık?","Asr 103:1–3","#C2D7B5"],["2026-10-18","Şefkat sözde kalmasın","İhtiyaç sahiplerini ne kadar gözetiyoruz?","Duhâ 93:9–11","#E4B69B"],["2026-10-19","Farklılıklar ve tanışmak","Birbirimizi tanımaya ne kadar açığız?","Hucurât 49:13","#B9CFD1"],["2026-10-20","Zorlukla birlikte kolaylık","Zor zamanlarda hangi imkânları görüyoruz?","İnşirâh 94:5–6","#C9C3DD"],["2026-10-21","İbadet ve sorumluluk","İbadetimiz davranışlarımıza yansıyor mu?","Mâûn 107:4–7","#D3C69B"],["2026-10-22","Rabbim, ilmimi artır","Bugün hangi yeni soruyu sorduk?","Tâhâ 20:114","#AFCBC5"],["2026-10-23","Bilginin izini sür","Duyduklarımızı araştırıyor muyuz?","İsrâ 17:36","#D8BE9F"],["2026-10-24","Gerçekten dinliyor muyuz?","Dinlemek ile düşünmek aynı şey mi?","Kâf 50:37","#C7D4B0"],["2026-10-25","Adalet ve iyilik","Adalet günlük hayatımıza nasıl yansıyor?","Nahl 16:90","#E1B7A2"],["2026-10-26","Alçakgönüllülük","Sesimiz ve tavrımız ne hissettiriyor?","Lokmân 31:18–19","#C3CADF"],["2026-10-27","Tane tane dinlemek","Tilavetin ritmini fark ediyor muyuz?","Müzzemmil 73:4","#C3D7CC"],["2026-10-28","Ayetler üzerinde düşünmek","Ayetlerin bağlamını araştırıyor muyuz?","Sâd 38:29","#E2CBAA"],["2026-10-29","Nimetleri fark etmek","Her gün hangi nimetleri gözden kaçırıyoruz?","Rahmân 55:13","#B9D4D2"],["2026-10-31","Dinle, düşün, değerlendir","Duyduğumuz sözü nasıl değerlendiriyoruz?","Zümer 39:18","#D9C6AA"]]'
        run: |
          python - <<'PY'
          import os, json, math, random
          from PIL import Image, ImageDraw, ImageFont
          rows=json.loads(os.environ["TOPICS_JSON"])
          os.makedirs("assets/namazdaanla",exist_ok=True)
          font="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          fbrand=ImageFont.truetype(bold,39)
          ftitle=ImageFont.truetype(bold,85)
          fquestion=ImageFont.truetype(font,48)
          fref=ImageFont.truetype(bold,45)
          fsmall=ImageFont.truetype(font,29)
          def wrap(draw,text,f,maxw):
              words=text.split()
              out=[]; line=""
              for word in words:
                  new=(line+" "+word).strip()
                  if draw.textbbox((0,0),new,font=f)[2]>maxw and line:
                      out.append(line);line=word
                  else: line=new
              if line:out.append(line)
              return out
          for i,(slug,title,question,ref,accent) in enumerate(rows):
              W,H=1080,1350
              img=Image.new("RGB",(W,H),(17,52,46))
              d=ImageDraw.Draw(img)
              c=tuple(bytes.fromhex(accent[1:]))
              for y in range(H):
                  t=y/H
                  d.line([(0,y),(W,y)],fill=(int(18-7*t),int(60-21*t),int(51-16*t)))
              for j in range(7):
                  rr=150+j*87
                  d.ellipse((800-rr,670-rr,800+rr,670+rr),outline=tuple(int(x*.38+25) for x in c),width=2)
              d.rounded_rectangle((72,73,1008,1275),radius=35,outline=c,width=3)
              d.text((112,132),"NAMAZDA ANLA",font=fbrand,fill=(250,244,224))
              d.text((113,205),"KUR'AN'I ANLAMAYA BİR ADIM",font=fsmall,fill=c)
              d.rounded_rectangle((112,287,310,295),radius=3,fill=c)
              y=360
              for line in wrap(d,title,ftitle,820):
                  d.text((109,y),line,font=ftitle,fill=(255,250,233))
                  y+=111
              y+=53
              for line in wrap(d,question,fquestion,800):
                  d.text((113,y),line,font=fquestion,fill=(233,237,226))
                  y+=73
              d.line((113,1114,965,1114),fill=c,width=3)
              d.text((113,1145),ref,font=fref,fill=c)
              d.text((113,1210),"Kamerasız akıllı gözlük konsepti",font=fsmall,fill=(227,231,219))
              img.save("assets/namazdaanla/"+slug+".png",optimize=True)
          print("Generated",len(rows),"original images")
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/namazdaanla
          if ! git diff --cached --quiet; then
            git commit -m "Generate Namazda Anla October social image assets"
            git push
          fi
