name: Publish Namazda Anla 47-24 premium film
on:
  push:
    paths:
      - ".github/workflows/import-film-47-24.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch finished original film from production edit session
        run: |
          set -euo pipefail
          mkdir -p public/videos
          BASE="https://sb-5jupk1tdwi4v.vercel.run"
          for name in namazda-anla-yeni-film-muhammed-47-24.mp4 namazda-anla-yeni-film-kapak.jpg namazda-anla-yeni-film-kaynaklar.txt namazda-anla-yeni-film-sync.json; do
            curl -fL --retry 4 --max-time 120 --silent --show-error "$BASE/$name" -o "public/videos/$name"
          done
          test "$(stat -c%s public/videos/namazda-anla-yeni-film-muhammed-47-24.mp4)" -gt 8000000
          file public/videos/namazda-anla-yeni-film-muhammed-47-24.mp4
      - name: Commit published film
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/namazda-anla-yeni-film-muhammed-47-24.mp4 public/videos/namazda-anla-yeni-film-kapak.jpg public/videos/namazda-anla-yeni-film-kaynaklar.txt public/videos/namazda-anla-yeni-film-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish coherent congregation and smart-glasses film featuring Muhammad 47:24 [skip ci]"
            git push
          fi
